ender()});function renderKeepingFocus(){const el=document.activeElement;const id=el&&el.id;const start=el&&el.selectionStart,end=el&&el.selectionEnd;const pane=document.querySelector("main");const top=pane?pane.scrollTop:0;render();const next=id?document.getElementById(id):null;if(next){next.focus({preventScroll:true});if(start!=null&&next.setSelectionRange){try{next.setSelectionRange(start,end)}catch(_){}}}const newPane=document.querySelector("main");if(newPane)newPane.scrollTop=top}document.addEventListener("keydown",e=>{if(state.view!=="present")return;if(e.key==="ArrowRight"||e.key==="PageDown"){state.slide=Math.min(state.slide+1,pitchSlides().length-1);render()}if(e.key==="ArrowLeft"||e.key==="PageUp"){state.slide=Math.max(state.slide-1,0);render()}if(e.key==="Escape"){state.view="app";render()}});document.addEventListener("input",e=>{const el=e.target.closest("[data-in]");if(!el)return;const[kind,key]=el.dataset.in.split(":");const v=el.value;switch(kind){case"tableName":state.tableName=v;break;case"ceoRead":state.ceoRead=v;break;case"stanceWhy":state.stanceWhy=v;break;case"stageWhy":state.stageWhy[key]=v;break;case"pickWhy":state.pickWhy[key]=v;break;case"mapDecline":state.mapDecline=v;break;case"situationStatement":state.situationStatement=v;break;case"custname":state.customCases[+key].name=v;break;case"custdoes":state.customCases[+key].does=v;break;case"custnot":state.customCases[+key].doesNot=v;break;case"weight":state.weights[key]=+v;softRefreshWeights();break;case"rejection":state.rejection=v;break;case"buildNote":state.buildNote=v;break;case"pilotWho":state.pilotWho=v;break;case"killCriterion":state.killCriterion=v;break;case"target":{const m=state.successMetrics.find(x=>x.id===key);if(m)m.target=v;break}case"mit":{const r=state.risks.find(x=>x.id===key);if(r)r.mitigation=v;break}}if(kind!=="weight")renderKeepingFocus()});function softRefreshWeights(){document.querySelectorAll('[data-in^="weight:"]').forEach(el=>{const k=el.dataset.in.split(":")[1];const lbl=el.nextElementSibling;if(lbl)lbl.textContent=state.weights[k]})}document.addEventListener("change",e=>{if(e.target.closest('[data-in^="weight:"]'))render()});document.addEventListener("blur",e=>{const el=e.target.closest?e.target.closest("[data-edit]"):null;if(!el)return;const[kind,key]=el.dataset.edit.split(":");const txt=el.textContent.trim();const PLACEHOLDER="Write your headline here";if(kind==="pitchHeadline")state.pitchHeadline=txt===PLACEHOLDER?"":txt;if(kind==="block")state.pitchEdits[key]=txt;render()},true);setInterval(()=>{if(state.secondsLeft>0)state.secondsLeft--;const c=$("#clock");if(c)c.textContent=fmtTime(state.secondsLeft)},1e3);render();
